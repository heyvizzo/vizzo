<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tooltip</title>
  <style>
    :root { --bg: #27272a; --text: #fafafa; --edge: rgba(0, 0, 0, 0.2); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #3f3f46; --text: #fafafa; --edge: rgba(255, 255, 255, 0.12); }
    }
    :root[data-theme="dark"] { --bg: #3f3f46; --text: #fafafa; --edge: rgba(255, 255, 255, 0.12); }
    html, body { margin: 0; background: transparent; overflow: hidden; pointer-events: none; user-select: none; }
    #tip {
      display: inline-block; width: max-content; max-width: 320px; padding: 5px 8px; box-sizing: border-box;
      background: var(--bg); color: var(--text); border: 1px solid var(--edge); border-radius: 6px;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; white-space: pre-line; overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div id="tip"></div>
  <script>
    // main.ts sends the text; this page lays it out and reports its size, then main.ts places and shows the view.
    const tip = document.getElementById("tip");
    window.shell.tooltip.onText((id, text) => {
      tip.textContent = text;
      const r = tip.getBoundingClientRect();
      window.shell.tooltip.size(id, Math.ceil(r.width), Math.ceil(r.height));
    });
  </script>
</body>
</html>
