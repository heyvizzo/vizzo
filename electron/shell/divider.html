<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Divider</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Colours: theme.css, from shared/theme.ts (scripts/theme-css.ts). */
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; cursor: col-resize; user-select: none; }
    .line { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; margin-left: -0.5px; background: var(--line); transition: background 0.1s; }
    body:hover .line { width: 2px; margin-left: -1px; background: var(--accent); }
    /* While dragging the view covers the window (the panes' moving edge shows where the divider is). */
    body.dragging .line { display: none; }
  </style>
</head>
<body>
  <div class="line"></div>
  <script>
    // Drag to resize the browser pane and the chat sidebar. This page only says when a drag starts and ends: main.ts
    // follows the cursor in between, and stretches this view over the window so the pointer is never lost to the
    // other views and the col-resize cursor stays.
    let dragging = false;
    const end = () => {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove("dragging");
      window.shell.divider("end");
    };
    document.body.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      dragging = true;
      document.body.setPointerCapture(e.pointerId);
      document.body.classList.add("dragging");
      window.shell.divider("start");
    });
    document.body.addEventListener("pointerup", end);
    // Released where we didn't see it.
    document.body.addEventListener("pointermove", (e) => { if (dragging && e.buttons === 0) end(); });
    window.addEventListener("blur", end);
  </script>
</body>
</html>
