<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a project folder</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Colours: theme.css, from shared/theme.ts (scripts/theme-css.ts). */
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    .box { max-width: 340px; text-align: center; }
    h1 { font-size: 17px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 16px; }
    button { font: inherit; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent-gradient); color: var(--on-accent); cursor: pointer; }
    button:hover:not(:disabled) { background: var(--accent-gradient-hover); }
    /* The app icon: the V on the blue field, both in the logo's gradients. */
    .logo { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 18px; background: linear-gradient(180deg, var(--logo-field-from), var(--logo-field-to)); box-shadow: 0 6px 20px var(--shadow); display: grid; place-items: center; }
    .logo svg { width: 44px; height: 44px; }
    .logo stop.top { stop-color: var(--logo-v-from); }
    .logo stop.bottom { stop-color: var(--logo-v-to); }
    .error { color: var(--err); min-height: 1.5em; margin: 12px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="box">
      <div class="logo" aria-hidden="true">
        <!-- The V from build/vizzo.icon/Assets/v.svg -->
        <svg viewBox="0 0 192 198"><defs><linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop class="top" offset="0" /><stop class="bottom" offset="1" /></linearGradient></defs>
          <path transform="translate(-4.92 197.29) scale(375)" fill="url(#v)" d="M0.287,-0C0.244,-0 0.207,-0.013 0.176,-0.038C0.145,-0.063 0.12,-0.105 0.1,-0.164L0.021,-0.392C0.01,-0.422 0.011,-0.45 0.022,-0.475C0.033,-0.5 0.053,-0.516 0.083,-0.523C0.11,-0.529 0.133,-0.526 0.153,-0.515C0.174,-0.504 0.188,-0.485 0.197,-0.458L0.275,-0.229C0.284,-0.202 0.296,-0.183 0.309,-0.17C0.323,-0.157 0.34,-0.154 0.36,-0.161C0.379,-0.168 0.389,-0.181 0.391,-0.198C0.392,-0.214 0.388,-0.234 0.379,-0.257C0.371,-0.278 0.36,-0.295 0.347,-0.31C0.334,-0.325 0.322,-0.34 0.311,-0.356C0.3,-0.372 0.295,-0.392 0.295,-0.416C0.295,-0.451 0.306,-0.478 0.329,-0.497C0.351,-0.517 0.38,-0.526 0.417,-0.525C0.448,-0.524 0.474,-0.513 0.494,-0.492C0.514,-0.471 0.524,-0.444 0.524,-0.411C0.524,-0.393 0.521,-0.374 0.515,-0.353C0.509,-0.332 0.502,-0.311 0.495,-0.288L0.455,-0.162C0.444,-0.129 0.432,-0.1 0.419,-0.075C0.407,-0.051 0.39,-0.033 0.369,-0.019C0.349,-0.006 0.322,-0 0.287,-0Z" />
        </svg>
      </div>
      <h1>Choose a project folder</h1>
      <p>The voice server and AI harnesses work in this folder. The chat starts once one is chosen.</p>
      <button id="choose" title="Pick the folder the voice server and its agents work in">Choose folder…</button>
      <p class="error" id="error"></p>
    </div>
  </main>
  <script>
    const choose = document.getElementById("choose");
    choose.onclick = async () => {
      choose.disabled = true;
      try {
        // Picking a folder makes the main process start the server and load the chat here.
        await shell.pickProject();
      } catch (err) {
        document.getElementById("error").textContent = String(err);
      } finally {
        choose.disabled = false;
      }
    };
  </script>
</body>
</html>
