    <rect x="-162" y="-150" width="64" height="300" rx="32" opacity="0.9"/>
    <rect x="-62" y="-230" width="64" height="460" rx="32"/>
    <rect x="38" y="-170" width="64" height="340" rx="32" opacity="0.9"/>
    <rect x="138" y="-95" width="64" height="190" rx="32" opacity="0.8"/>
